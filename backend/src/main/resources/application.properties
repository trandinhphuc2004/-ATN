# Application
spring.application.name=chemlab-backend
server.port=8888

# Encoding - ep UTF-8 cho HTTP request/response (tranh tieng Viet thanh dau '?')
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database - H2 in-memory (for testing)
spring.datasource.url=jdbc:h2:mem:chemlabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database - MySQL Docker container (disabled, switch back to use MySQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/chemlabdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Doc tu bien moi truong JWT_SECRET (>= 64 ky tu cho HS512). Gia tri mac dinh chi dung khi dev.
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-please-override-with-JWT_SECRET-env-variable-in-production}
jwt.expiration=86400000

# AI Configuration (OpenRouter - OpenAI-compatible API)
# Doc key tu bien moi truong OPENROUTER_API_KEY de tranh hard-code key vao source.
# Phai set bien moi truong truoc khi chay cac chuc nang AI (khong commit key len repo).
# Chuyen tu NVIDIA NIM sang OpenRouter: NVIDIA phan hoi cham/khong on dinh (42s -> >300s timeout).
ai.api.url=https://openrouter.ai/api/v1
ai.api.key=${OPENROUTER_API_KEY:}
# Model text tren OpenRouter. Danh sach: https://openrouter.ai/models
# mistral-small-3.2-24b: da test that "ca(oh)2+na2so4" -> 13.2s, JSON hop le, hoa hoc DUNG
# (Ca(OH)2 + Na2SO4 -> CaSO4 + 2NaOH), 4 animation steps. Nhanh + re (tiet kiem credit).
# LUU Y: tai khoan OpenRouter co the it credit -> model dat (gpt-4o) bi loi 402. Neu can:
#   - openai/gpt-4o-mini (15s, JSON sach nhat)  - qwen/qwen-2.5-72b-instruct (37s, manh hon)
ai.api.model=mistralai/mistral-small-3.2-24b-instruct
# Model soan bai hoc. Danh sach thu theo thu tu, cach nhau boi dau phay:
# neu model dau bi 429 (nha cung cap gioi han tam thoi) thi tu dong thu model tiep theo.
# Da thu that ngay 21/08/2026 voi cung prompt soan bai hoc:
#   gemma-4-31b-it:free   -> 6622 ky tu, 9 muc co bang so sanh + bai tap (TOT NHAT nhung
#                            hay bi 429 vi la model mien phi dung chung nhieu nguoi)
#   mistral-small-3.2     -> 2511 ky tu, 6 muc (tra phi, ON DINH nhat, cung model tao phan ung)
#   gpt-oss-20b:free      -> 3023 ky tu, khong chia muc h3
# Thu tu duoi day: uu tien chat luong, roi lui ve model on dinh.
ai.api.lesson-models=${OPENROUTER_LESSON_MODELS:google/gemma-4-31b-it:free,mistralai/mistral-small-3.2-24b-instruct,openai/gpt-oss-20b:free}

# Model vision (doc anh de thi). Model text co the KHONG doc duoc anh -> can model vision rieng.
# LOI CU: bien nay de TRONG va con doc bien moi truong cua NVIDIA (du du an da chuyen sang
# OpenRouter) -> analyzeExam() luon tra ve "chua duoc cau hinh", chuc nang chua de thi khong chay.
# Danh sach thu theo thu tu, cach nhau boi dau phay: neu model dau bi 429/402 thi tu dong
# thu model tiep theo (giong co che ai.api.lesson-models).
#   gemma-4-31b-it:free  -> mien phi, CO doc duoc anh, cung ho model da dung o lesson-models
#   mistral-small-3.2    -> tra phi nhung rat re + on dinh, cung model dang dung o ai.api.model
#   gemini-3.5-flash-lite-> du phong, context lon, doc anh tot
ai.api.vision-model=${OPENROUTER_VISION_MODELS:google/gemma-4-31b-it:free,mistralai/mistral-small-3.2-24b-instruct,google/gemini-3.5-flash-lite}


# YouTube Data API v3 - tim video bai giang goi y cho bai hoc / phan ung
# Cach lay key: console.cloud.google.com -> tao project -> bat "YouTube Data API v3"
#   -> Credentials -> Create credentials -> API key
# Doc tu bien moi truong YOUTUBE_API_KEY. De trong thi tinh nang video tu dong tat,
# trang bai hoc van hoat dong binh thuong (khong hien khu vuc video).
# Quota mien phi: 10.000 don vi/ngay, moi lan search ton 100 don vi -> 100 lan search/ngay.
# Backend da cache ket qua theo tu khoa nen thuc te dung it hon nhieu.
youtube.api.key=${YOUTUBE_API_KEY:}


# CORS
cors.allowed-origins=http://localhost:4200
